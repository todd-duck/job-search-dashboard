name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please do NOT paste personal data (resume, tracker, real config). Use invented values.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: Support bundle (python3 scripts/setup.py --support-bundle)
      render: text
